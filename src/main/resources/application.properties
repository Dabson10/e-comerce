spring.application.name=e-comerce

#Como se manejaran los datos de BD y codigo.
spring.jpa.hibernate.ddl-auto=validate
#Mostrara consultas en los logs.
spring.jpa.show-sql=true

#URL de la base de datos.
spring.datasource.url=${url}
#Nombre del usuario de la base de datos.
spring.datasource.username=${usuario}
#Clave de la base de datos
spring.datasource.password=${clave}
#Driver
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#Contraseña para seguridad de Spring Security
spring.security.user.password=${passwordS}
#Usuario para spring secutiry
spring.security.user.name=${userSec}

scalar.enabled=true
scalar.url=/v3/api-docs
#htpp://localhost:8080/scalar  //visualizar APIs